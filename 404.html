<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Totoro Manga App</title>
    <meta name="description" content="Oops! The page you are looking for does not exist. Navigate back to the official Totoro Manga and Manhwa app home.">
    <meta name="robots" content="noindex, follow">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --background: #060a13;
            --surface: #0b1326;
            --surface-hover: #121e3b;
            --primary: #ffb787;
            --primary-hover: #ffd1b3;
            --on-surface: #f3f4f6;
            --on-surface-muted: #9ca3af;
            --border-subtle: rgba(255, 183, 135, 0.15);
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--on-surface);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Floating background glow */
        .glow-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 183, 135, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            width: 90%;
            text-align: center;
            z-index: 2;
            position: relative;
            background: rgba(11, 19, 38, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            padding: 3rem 2rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .error-code {
            font-family: 'Manrope', sans-serif;
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary) 0%, #ff8c6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        .error-title {
            font-family: 'Manrope', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--on-surface);
        }

        .error-message {
            color: var(--on-surface-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Action buttons */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 480px) {
            .actions {
                flex-direction: row;
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all var(--transition-smooth);
            cursor: pointer;
            width: 100%;
        }

        @media (min-width: 480px) {
            .btn {
                width: auto;
            }
        }

        .btn-primary {
            background-color: var(--primary);
            color: #060a13;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 183, 135, 0.25);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--on-surface);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background-color: var(--surface-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Animated Soot Sprite mascot */
        .sprite {
            width: 60px;
            height: 60px;
            background: #000;
            border-radius: 50%;
            position: relative;
            margin: 0 auto 2.5rem auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            animation: float 4s ease-in-out infinite;
        }

        .sprite::before, .sprite::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 15px;
        }

        .sprite::before {
            left: 12px;
        }

        .sprite::after {
            right: 12px;
        }

        .sprite-pupil {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #000;
            border-radius: 50%;
            top: 20px;
            animation: look 5s ease-in-out infinite;
        }

        .pupil-left {
            left: 17px;
        }

        .pupil-right {
            right: 17px;
        }

        /* Spikes */
        .sprite-spike {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid #000;
        }

        .spike-1 { top: -8px; left: 24px; }
        .spike-2 { bottom: -8px; left: 24px; }
        .spike-3 { left: -8px; top: 24px; transform: rotate(-90deg); }
        .spike-4 { right: -8px; top: 24px; transform: rotate(90deg); }
        .spike-5 { top: -2px; left: 6px; transform: rotate(-45deg); }
        .spike-6 { top: -2px; right: 6px; transform: rotate(45deg); }
        .spike-7 { bottom: -2px; left: 6px; transform: rotate(-135deg); }
        .spike-8 { bottom: -2px; right: 6px; transform: rotate(135deg); }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes look {
            0%, 100%, 80%, 90% { transform: translate(0, 0); }
            30%, 40% { transform: translate(2px, -1px); }
            50%, 60% { transform: translate(-2px, 1px); }
        }
    </style>
</head>

<body>
    <div class="glow-bg"></div>

    <div class="container">
        <!-- Animated Soot Sprite mascot -->
        <div class="sprite">
            <div class="sprite-spike spike-1"></div>
            <div class="sprite-spike spike-2"></div>
            <div class="sprite-spike spike-3"></div>
            <div class="sprite-spike spike-4"></div>
            <div class="sprite-spike spike-5"></div>
            <div class="sprite-spike spike-6"></div>
            <div class="sprite-spike spike-7"></div>
            <div class="sprite-spike spike-8"></div>
            <div class="sprite-pupil pupil-left"></div>
            <div class="sprite-pupil pupil-right"></div>
        </div>

        <div class="error-code">404</div>
        <h1 class="error-title">Lost in the Shadow?</h1>
        <p class="error-message">The chapter or volume you are looking for has been moved, deleted, or never existed. Let's get you back to reading.</p>
        
        <div class="actions">
            <a href="index.html" class="btn btn-primary">
                <span class="material-symbols-outlined">home</span>
                Back to Home
            </a>
            <a href="versions.html" class="btn btn-secondary">
                <span class="material-symbols-outlined">history</span>
                Version History
            </a>
        </div>
    </div>
</body>

</html>
